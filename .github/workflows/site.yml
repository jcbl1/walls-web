name: Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy gallery
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore thumbnails
        uses: actions/cache@v4
        with:
          path: site/thumbs
          key: thumbs-v1-${{ github.run_id }}
          restore-keys: |
            thumbs-v1-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Generate manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/sitegen.py --ci
      - name: Generate thumbnails
        run: ./.github/thumbgen.py
      - name: Restore previous stats
        run: |
          site_url=$(python3 -c "import configparser; c = configparser.ConfigParser(); c.read('.github/config.ini'); print(dict(c['site']).get('site_url', ''))")
          if [ -n "$site_url" ]; then
            tmp=$(mktemp)
            if curl -fsS "${site_url%/}/stats.json" -o "$tmp"; then
              mv "$tmp" site/stats.json
            else
              rm -f "$tmp"
            fi
          fi
      - name: Generate stats
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: ./.github/statsgen.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
